name: walnutpie c++

on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch: {}

env:
  CACHE_VERSION: 3

# only run one copy per PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{matrix.cfg.os}}/${{matrix.cfg.compiler}})
    runs-on: ${{matrix.cfg.os}}-${{matrix.cfg.version || 'latest'}}
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - os: windows
            compiler: msvc
          - os: windows
            compiler: gcc
          - os: ubuntu
            compiler: gcc
          - os: macos
            version: 26
            compiler: clang

    steps:
      - name: Check out github
        uses: actions/checkout@v7

      - name: Dependency caching
        uses: actions/cache@v5
        id: deps-cache
        with:
          path: ./build/_deps/
          key: ${{ runner.os }}-${{ matrix.cfg.compiler }}-deps-${{ hashFiles('**/CMakeLists.txt') }}-v${{ env.CACHE_VERSION }}

      - name: "Windows: Set up MSVC"
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
        if: matrix.cfg.compiler == 'msvc' && matrix.cfg.os == 'windows'
      - name: "Windows: Set up GCC"
        uses: bwoodsend/setup-winlibs-action@v1
        if: matrix.cfg.compiler == 'gcc' && matrix.cfg.os == 'windows'

      - name: Build
        run: |
          cmake -S . -B build/ -G Ninja -DWALNUTPIE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build/ --parallel 4 --config RelWithDebInfo

      - name: Run examples
        run: |
          cd build/
          ls -lha examples/
          ./examples/walnutpie_api${{ matrix.cfg.os == 'windows' && '.exe' || '' }}
        shell: bash

      - name: Test
        run: |
          cd build/
          ctest --output-on-failure --parallel 4 --repeat until-pass:2 -C RelWithDebInfo
        shell: bash
